name: YouTube embed refresh

# Keeps the YouTube live IDs in assets/js/data.js fresh. The video IDs these
# channels issue rotate whenever a stream restarts, so a stale ID embeds as
# error 100/153 (and 150 when a channel disables embedding). Instead of
# probing all 62 embeds one by one, the script compares them against each
# source's current live set (one fetch per channel/portal) and swaps rotated
# IDs by name. Runs hourly so a rotation is at most ~1h stale; pushes to
# main, and GitHub Pages redeploys on push.
# The viewer's own auto-retry picks a pushed fix up live, no reload needed.
on:
  schedule:
    - cron: "7 * * * *" # hourly at :07 UTC (14:07 WIB); clear of the VM cron's 05:23 WIB run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs (audit run-1, ci-unpinned-floating-actions):
      # floating tags let a retagged action run with this job's push token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: pip install -q --require-hashes -r tools/yt-refresh-requirements.txt
      - name: Refresh YouTube IDs
        run: python3 tools/yt-refresh-ci.py
